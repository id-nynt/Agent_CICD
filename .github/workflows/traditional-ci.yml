name: Traditional CI Baseline

on:
  push:
  pull_request:

jobs:
  traditional-ci:
    name: Build, Test, And Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Docker Compose version
        run: docker compose version

      - name: Ensure action scripts are executable
        run: chmod +x cicd/actions/*.sh

      - name: Build candidate
        run: ./cicd/actions/build.sh candidate

      - name: Test candidate
        run: ./cicd/actions/test.sh candidate

      - name: Security scan candidate
        run: ./cicd/actions/security_scan.sh candidate
