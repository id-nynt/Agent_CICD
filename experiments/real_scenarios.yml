schema_version: 1
notes: "Phase 15 scenario definitions for real Prometheus telemetry experiments. These definitions preserve the existing shell action interface and are intended for the scenario-driven runner in Phase 16."

scenarios:
  real_success:
    description: "Healthy candidate release; staging and production pass health checks and payment traffic remains stable."
    environment:
      staging:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
    traffic_pattern: "Send balanced /pay and /refund requests to production after deployment; expect HTTP 200 responses."
    observation_count: 1
    reobserve_expected: false
    traditional_expected_decision: release_success
    bdi_expected_decision: release_complete
    proves: "A clean baseline where traditional CI/CD and BDI agree because health, error rate, latency, and availability are all good."

  real_high_error_rate:
    description: "Candidate passes /health but business traffic fails, producing a high Prometheus error rate."
    environment:
      staging:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: candidate
        failure_mode: pay_error
        force_error_rate: 0
        extra_latency_ms: 0
    traffic_pattern: "Send repeated /pay requests mixed with /refund requests; expect /pay to return HTTP 500 while /health still passes."
    observation_count: 1
    reobserve_expected: false
    traditional_expected_decision: release_success
    bdi_expected_decision: rollback_production
    proves: "BDI can roll back from telemetry-derived production instability that a health-check-only pipeline would miss."

  real_high_latency:
    description: "Candidate succeeds functionally but production request latency is above the configured threshold."
    environment:
      staging:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 750
    traffic_pattern: "Send successful /pay and /refund requests to production; expect HTTP 200 responses with high p95 latency."
    observation_count: 2
    reobserve_expected: true
    traditional_expected_decision: release_success
    bdi_expected_decision: pause_reobserve
    proves: "BDI can treat a non-crashing but degraded release as ambiguous enough to pause and collect another observation before rollback."

  real_low_availability:
    description: "Production candidate is unhealthy, reducing availability and failing the production health check."
    environment:
      staging:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: candidate
        failure_mode: unhealthy
        force_error_rate: 0
        extra_latency_ms: 0
    traffic_pattern: "Check /health and send production traffic; expect failed health checks and low availability."
    observation_count: 1
    reobserve_expected: false
    traditional_expected_decision: rollback
    bdi_expected_decision: rollback_production
    proves: "Both approaches should reject an obviously unhealthy production candidate, giving a control case for rollback behavior."

  real_transient_recovery:
    description: "Initial production telemetry is bad, but a later observation shows recovery without rollback."
    environment:
      staging:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: candidate
        failure_mode: none
        force_error_rate: 0.5
        extra_latency_ms: 0
    traffic_pattern: "Observation 1 sends error-prone production traffic; observation 2 clears injected errors and sends healthy traffic."
    observation_count: 2
    reobserve_expected: true
    traditional_expected_decision: rollback
    bdi_expected_decision: release_complete
    proves: "BDI can pause after a bad first observation and avoid an unnecessary rollback when real telemetry recovers."

  real_network_suspected:
    description: "Production metrics are degraded, but context suggests a temporary network issue rather than a bad candidate."
    environment:
      staging:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: candidate
        failure_mode: none
        force_error_rate: 0.2
        extra_latency_ms: 600
    traffic_pattern: "Send production traffic during suspected network degradation; expect mixed failures and high latency."
    observation_count: 2
    reobserve_expected: true
    traditional_expected_decision: rollback
    bdi_expected_decision: pause_reobserve
    proves: "BDI can use context ambiguity to delay destructive action and reobserve instead of immediately rolling back."

  real_staging_failure:
    description: "Candidate fails before production because staging health is unhealthy."
    environment:
      staging:
        version: candidate
        failure_mode: unhealthy
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: stable
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
    traffic_pattern: "Run staging deployment and staging /health only; do not promote candidate to production."
    observation_count: 0
    reobserve_expected: false
    traditional_expected_decision: stop_pipeline
    bdi_expected_decision: stop_pipeline
    proves: "BDI preserves standard CI/CD safety gates and stops before production when staging fails."

  real_security_scan_failure:
    description: "Candidate is blocked by the existing security scan before staging or production deployment."
    environment:
      staging:
        version: candidate
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
      production:
        version: stable
        failure_mode: none
        force_error_rate: 0
        extra_latency_ms: 0
    traffic_pattern: "Run build, test, and security scan only; do not generate service traffic after the security gate fails."
    observation_count: 0
    reobserve_expected: false
    traditional_expected_decision: stop_pipeline
    bdi_expected_decision: stop_pipeline
    proves: "BDI remains compatible with the public CI/CD gate sequence and stops on a pre-deployment security failure."
